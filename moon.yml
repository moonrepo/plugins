id: root

tasks:
  format:
    command: cargo fmt --all --check
    inputs: []

  format-write:
    extends: format
    command: cargo fmt --all -- --emit=files
    preset: utility

  build-all:
    command: just build
    inputs: []
    preset: utility

  test-all:
    command: cargo nextest run --workspace
    inputs: []
    deps:
      - build-all
    preset: utility

  # Shared crates aren't moon projects, so they don't inherit the `test` task
  test-crates:
    command: cargo nextest run --no-default-features --no-tests=pass -p common -p '*_common'
    inputs:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - crates/**/*
    env:
      CARGO_TERM_COLOR: always
      NO_COLOR: "true"

workspace:
  inheritedTasks:
    include: []
