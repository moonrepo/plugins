[package]
name = "python_poetry_tool"
version = "0.2.0"
edition = "2024"
description = "Python Poetry WASM plugin for proto."
authors = ["Miles Johnson"]
license = "MIT"
repository = "https://github.com/moonrepo/plugins"
documentation = "https://github.com/moonrepo/plugins/tree/master/tools/python-poetry"
publish = false

[package.metadata.release]
pre-release-replacements = [
    { file = "./CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
lang_python_common = { path = "../../crates/lang-python-common" }
tool_common = { path = "../../crates/tool-common" }
extism-pdk = { workspace = true, optional = true }
proto_pdk = { workspace = true, optional = true }
serde = { workspace = true }
starbase_utils = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proto_pdk_test_utils = { workspace = true }
starbase_sandbox = { workspace = true }
tokio = { workspace = true }

[features]
default = ["wasm"]
wasm = ["dep:extism-pdk", "dep:proto_pdk", "tool_common/wasm"]
