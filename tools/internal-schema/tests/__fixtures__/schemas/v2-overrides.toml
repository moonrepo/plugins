format = "2"

[plugin]

[metadata]
name = "v2-test"
type = "command-line"

[install]
download_url = "https://example.com/v{version}/{download_file}"
archive_prefix = "tool-{version}"

[locate.exes.tool]
exe_path = "bin/tool"
primary = true

[platform.linux]
download_file = "tool-{arch}.tar.gz"
archs = ["x64", "arm64"]

[platform.linux.arch]
x64 = "amd64"
arm64 = "arm64"

[platform.freebsd]
download_file = "tool-freebsd-{arch}.tar.gz"

[platform.macos]
download_file = "tool-mac-{arch}.tar.gz"

# 2.x renamed the linux asset, and dropped linux arm64
[[overrides]]
range = ">=2.0.0"

[overrides.platform.linux]
download_file = "tool-v2-{arch}.tar.gz"
archs = ["x64"]

[overrides.platform.linux.arch]
x64 = "x86_64"

# 3.x moved hosts and exe location
[[overrides]]
range = "^3"

[overrides.install]
download_url = "https://new.example.com/{version}/{download_file}"
download_name = "ignored-{arch}.tar.gz"

[overrides.locate.exes.tool]
exe_path = "tool3/bin/tool"
primary = true

[source]
versions = ["1.0.0"]
