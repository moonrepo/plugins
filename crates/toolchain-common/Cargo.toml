[package]
name = "toolchain_common"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
common = { path = "../common" }

[features]
# moon doesn't provide proto's `load_tool_versions` host function, so tools
# embedded in toolchains load versions within the plugin instead
wasm = ["common/wasm", "common/tool-versions-fallback"]
